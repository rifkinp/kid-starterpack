name: Verify starters
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      templates: ${{ steps.matrix.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Catalog integrity
        run: |
          bun run validate
          bun run lint
          bun run test
      - id: matrix
        run: node scripts/ci-matrix.mjs
      - name: Install and check website
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
  templates:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.validate.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Verify standalone extraction, tests and HTTP smoke
        env:
          STARTER_PATH: ${{ matrix.template }}
        run: bun run verify:extraction "$STARTER_PATH"
  giget:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Verify GitHub Giget downloads at the exact pushed commit
        run: bun run verify:giget
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kid_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Test HTTP auth and two-user ownership on disposable PostgreSQL
        working-directory: templates/fullstack/sveltekit-postgres
        env:
          KID_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/kid_test_ci
        run: |
          bun install --frozen-lockfile
          bun run test:integration
