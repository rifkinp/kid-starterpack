name: Deploy documentation site (GitHub Pages)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install
        working-directory: website
      - run: bun run build
        working-directory: website
        env:
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_BASE_PATH: /kid-starterpack
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
