name: Verify Kid Starter CLI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    name: CLI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check CLI and test sparse checkout
        working-directory: packages/create-kid-starter
        run: |
          npm run check
          npm test
      - name: Package dry run
        working-directory: packages/create-kid-starter
        run: npm pack --dry-run
